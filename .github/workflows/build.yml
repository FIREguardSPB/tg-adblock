name: Build patched Telegram (ad-blocker)

on:
  schedule:
    - cron: '0 */6 * * *'      # every 6 hours: track the latest DrKLO release
  workflow_dispatch:
    inputs:
      ref:
        description: 'DrKLO/Telegram ref (tag or commit). Empty on schedule = latest release.'
        required: false
        default: '9b50143d8896d255d03155598937e4f3e28afd86'   # base the patch is known to apply to (12.8.1)

permissions:
  contents: write              # needed to publish releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (patch + workflow)
        uses: actions/checkout@v4

      - name: Resolve upstream ref
        id: ref
        run: |
          # DrKLO develops on master, but their newest GitHub *tag* is stale
          # (release-11.4.2-5469, far behind the 12.x the patch is built against).
          # The old "latest release-* tag" logic therefore checked out an OLDER tree
          # than the patch's base, the patch did not apply, and every scheduled run
          # failed. Until the patch is re-anchored to a newer upstream, default
          # scheduled/empty builds to the known-good pinned base so they reproduce a
          # working APK (and become a no-op once that ref is released). To build a
          # newer upstream, dispatch this workflow with an explicit ref.
          BASE=9b50143d8896d255d03155598937e4f3e28afd86
          REF="${{ github.event.inputs.ref }}"
          if [ -z "$REF" ]; then
            REF="$BASE"
          fi
          # Release identity is the ad-blocker patch version, NOT the upstream ref,
          # so improving the patch on the same base still produces a new release the
          # in-app updater can detect. ADBLOCK_VERSION is the single source of truth
          # (com.tgadblock.Version), read straight out of the patch.
          VER=$(grep -oE 'ADBLOCK_VERSION *= *[0-9]+' patches/android-adblock.patch \
                | grep -oE '[0-9]+' | head -1)
          [ -z "$VER" ] && VER=0
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=tg-adblock-v$VER" >> "$GITHUB_OUTPUT"
          echo "Building upstream ref: $REF  (ad-blocker v$VER)"

      - name: Skip if this ref was already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.ref.outputs.tag }}" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.ref.outputs.tag }} already exists — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch DrKLO/Telegram at ref
        if: steps.check.outputs.exists == 'false'
        run: |
          git init upstream
          cd upstream
          git remote add origin https://github.com/DrKLO/Telegram.git
          git fetch --depth 1 origin "${{ steps.ref.outputs.ref }}"
          git checkout FETCH_HEAD

      - name: Apply ad-blocker patch
        if: steps.check.outputs.exists == 'false'
        run: |
          cd upstream
          PATCH=../patches/android-adblock.patch
          # Clean apply first (exact base); fall back to a 3-way merge to tolerate
          # minor upstream drift; only then give up and fail loudly.
          if git apply --whitespace=nowarn "$PATCH" \
             || git apply --3way --whitespace=nowarn "$PATCH"; then
            echo "Patch applied."
          else
            echo "::error::Patch did not apply to ${{ steps.ref.outputs.ref }} — upstream changed the hooked files. Re-anchor patches/android-adblock.patch."
            exit 1
          fi

      - name: Inject private api_id/api_hash from secrets
        if: steps.check.outputs.exists == 'false'
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          # Keep the private key OUT of the repo: the patch ships DrKLO's default
          # api_id=4 (rate-limited), and we swap in the real key here from secrets.
          F=upstream/TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          if [ -n "$TG_API_ID" ] && [ -n "$TG_API_HASH" ]; then
            sed -i "s/public static int APP_ID = 4;/public static int APP_ID = ${TG_API_ID};/" "$F"
            sed -i "s|public static String APP_HASH = \"014b35b6184100b085b0d0572f9b5103\";|public static String APP_HASH = \"${TG_API_HASH}\";|" "$F"
            if grep -q "APP_ID = 4;" "$F"; then
              echo "::error::Failed to inject APP_ID — BuildVars.java default line not found (upstream changed it)."; exit 1
            fi
            echo "Injected private api credentials from secrets."
          else
            echo "::warning::TG_API_ID/TG_API_HASH secrets not set — building with default api_id=4 (login will be rate-limited)."
          fi

      - name: Free up disk space
        if: steps.check.outputs.exists == 'false'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/share/swift \
                      /usr/local/share/powershell /opt/hostedtoolcache/CodeQL \
                      /usr/local/lib/android/sdk/ndk || true
          df -h /

      - name: Set up JDK 17
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.check.outputs.exists == 'false'
        uses: android-actions/setup-android@v3

      - name: Install NDK / cmake / platform
        if: steps.check.outputs.exists == 'false'
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" \
                     "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build release APK
        if: steps.check.outputs.exists == 'false'
        run: |
          cd upstream
          # R8 on this large app needs more heap than the repo's default 4g.
          echo "org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8" >> gradle.properties
          ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon --stacktrace

      - name: Publish release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find upstream/TMessagesProj_App/build/outputs/apk/afat/release -name '*.apk' | head -1)
          cp "$APK" "${{ steps.ref.outputs.tag }}.apk"
          gh release create "${{ steps.ref.outputs.tag }}" \
            "${{ steps.ref.outputs.tag }}.apk" \
            -R "${{ github.repository }}" \
            --latest \
            --title "Telegram AAD v${{ steps.ref.outputs.version }} (DrKLO ${{ steps.ref.outputs.ref }})" \
            --notes "Telegram AAD (Anti-AD) v${{ steps.ref.outputs.version }} — patched Telegram for Android (DrKLO upstream \`${{ steps.ref.outputs.ref }}\`) with the tap-to-block ad-blocker and a daily update check. Debug-signed with the repo keystore; sideload only. An in-place update keeps your blocked-ad rules."
